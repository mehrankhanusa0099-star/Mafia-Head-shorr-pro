<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAFIA HEADSHOT - LEVELS</title>
<style>
body{background:black;color:white;text-align:center;font-family:Arial;margin:0;padding:10px}
h1{color:yellow}
#game{width:95%;height:400px;background:#111;position:relative;border:3px solid red;border-radius:15px;margin:auto;overflow:hidden}
#target{width:80px;height:80px;background:red;border-radius:50%;position:absolute;top:100px;left:100px;line-height:80px;font-size:35px}
button{padding:15px 25px;font-size:19px;border:none;border-radius:15px;margin:5px;color:white}
.easy{background:green}.pro{background:orange}.king{background:red}
.start{background:#ffcc00;color:black;font-size:22px;padding:18px 40px}
a{display:block;background:#333;color:white;padding:12px;margin:15px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<h1>🔥 MAFIA HEADSHOT 🔥</h1>
<p>LEVEL CHUNO:</p>
<button class="easy" onclick="setLevel(1,'EASY')">🟢 EASY</button>
<button class="pro" onclick="setLevel(2,'PRO')">🟠 PRO</button>
<button class="king" onclick="setLevel(3,'MAFIA KING 👑')">🔴 MAFIA KING</button>
<p id="level">LEVEL: EASY</p>
<p id="score">SCORE: 0 | HEADSHOT: 0</p>
<p id="time">TIME: 30</p>
<div id="game"><div id="target" onclick="hit()">🎯</div></div>
<button class="start" onclick="start()">▶️ GAME START</button>
<a href="sensitivity.html">🎯 SENSITIVITY DEKHO</a>
<a href="index.html">⬅️ BACK TO HOME</a>
<script>
let score=0,head=0,time=30,playing=false,speed=1,levelName='EASY';
function setLevel(s,n){speed=s;levelName=n;document.getElementById('level').innerText='LEVEL: '+n;alert(n+' LEVEL SELECTED!');}
function start(){score=0;head=0;time=30;playing=true;update();
let t=setInterval(function(){time--;document.getElementById('time').innerText='TIME: '+time;
if(time<=0){clearInterval(t);playing=false;alert('GAME OVER! '+levelName+' SCORE: '+score);}},1000);}
function hit(){if(!playing){alert('Pehle START dabao!');return;}
score+=10*speed;head+=1;
let size=80-(speed*10);
document.getElementById('target').style.width=size+'px';document.getElementById('target').style.height=size+'px';
document.getElementById('target').style.left=Math.floor(Math.random()*250)+'px';
document.getElementById('target').style.top=Math.floor(Math.random()*300)+'px';
update();}
function update(){document.getElementById('score').innerText='SCORE: '+score+' | HEADSHOT: '+head;}
</script>
</body>
</html>
